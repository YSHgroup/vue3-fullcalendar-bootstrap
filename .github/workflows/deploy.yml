name: Deploy Daymark to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build and type-check
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Wait for Pages artifact indexing
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 8; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              })

              if (data.artifacts.some((artifact) => artifact.name === process.env.PAGES_ARTIFACT_NAME && !artifact.expired)) {
                core.info('The Pages artifact is available for deployment.')
                return
              }

              core.info('Waiting for the Pages artifact to appear in the workflow run.')
              await new Promise((resolve) => setTimeout(resolve, 2000))
            }

            core.setFailed('The uploaded Pages artifact did not become available for deployment.')

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
